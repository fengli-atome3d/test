services:
  postgres:
    image: postgres:16-alpine
    container_name: ${DB_CONTAINER_NAME:-middleware-postgres}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - middleware-postgres-data:/var/lib/postgresql/data
    # No published port — only reachable from other containers on this
    # docker-compose network (by service name "postgres"), never from
    # the host OS directly or the internet. Fully dedicated to the
    # middleware, isolated from Movu's own Postgres instance entirely.
    restart: unless-stopped

  atome-middleware:
    build: .
    container_name: ${APP_CONTAINER_NAME:-atome-middleware}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # So files written inside the container (e.g. new Alembic migration
      # files generated via `docker-compose run --rm atome-middleware
      # alembic revision --autogenerate`) actually persist to the host's
      # disk, not just inside a temporary container that's deleted
      # immediately after (--rm).
      - ./migrations:/app/migrations
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  middleware-postgres-data: