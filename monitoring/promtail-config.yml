server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
    pipeline_stages:
      # Extract the log level (INFO/WARNING/ERROR/etc) as a proper Loki
      # label, not just text buried in the message. Both our own app
      # logger ("WARNING:atome_middleware:...") and uvicorn's own access
      # logs ("INFO:     172.18.0.1:...") start with LEVELNAME: , so one
      # regex covers both. This enables filtering/coloring by level in
      # Grafana instead of text-searching for "ERROR" every time.
      - regex:
          expression: '^(?P<level>[A-Z]+):'
      - labels:
          level:

      # --- Security requirement: scrub secrets before they ever reach
      # Loki's storage. Matches tokens/keys/passwords appearing anywhere
      # in a log line, replaces the value with ***REDACTED***.
      - replace:
          expression: '(?i)(authorization["\s:=]+)([^\s",}]+)'
          replace: '${1}***REDACTED***'
      - replace:
          expression: '(?i)(api[_-]?key["\s:=]+)([^\s",}]+)'
          replace: '${1}***REDACTED***'
      - replace:
          expression: '(?i)(password["\s:=]+)([^\s",}]+)'
          replace: '${1}***REDACTED***'
      - replace:
          expression: '(?i)(x-webhook-secret["\s:=]+)([^\s",}]+)'
          replace: '${1}***REDACTED***'